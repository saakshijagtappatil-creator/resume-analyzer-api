# k8s/staging/deployment.yml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume-analyzer
  namespace: staging
  labels:
    app: resume-analyzer
    env: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resume-analyzer
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: resume-analyzer
        env: staging
    spec:
      containers:
        - name: resume-analyzer
          image: ${OCIR_IMAGE}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: resume-analyzer-config
            - secretRef:
                name: resume-analyzer-secret
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 512Mi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: upload-dir
              mountPath: /tmp/resumes
      volumes:
        - name: upload-dir
          emptyDir: {}
      imagePullSecrets:
        - name: ocir-secret