# src/main/resources/application.yml

spring:
  application:
    name: resume-analyzer
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          provider:
            google:
              authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
              token-uri: https://oauth2.googleapis.com/token
              user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
              user-name-attribute: sub

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 6MB

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  ai:
    api-key: ${AI_API_KEY:placeholder}
    model: ${AI_MODEL:claude-opus-4-6}
    base-url: ${AI_BASE_URL:https://api.anthropic.com}
    max-tokens: ${AI_MAX_TOKENS:4096}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
  file:
    upload-dir: ${FILE_UPLOAD_DIR:/tmp/resumes}
    max-size-bytes: 5242880
    allowed-content-type: application/pdf
  oci:
    namespace: ${OCI_NAMESPACE}
    bucket-name: ${OCI_BUCKET_NAME:resume-analyzer-files}
    region: ${OCI_REGION:us-ashburn-1}
    user-ocid: ${OCI_USER_OCID}
    tenancy-ocid: ${OCI_TENANCY_OCID}
    fingerprint: ${OCI_FINGERPRINT}
    private-key: ${OCI_PRIVATE_KEY}
  oauth2:
      redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/auth/callback}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method